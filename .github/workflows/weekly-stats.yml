name: Fortnite Stats Refresh

on:
  schedule:
    # Refreshes at the start of every hour, Pacific time.
    - cron: "0 * * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch current stats
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/fetch-weekly-stats.js

      - name: Commit and push refreshed snapshots
        run: |
          git config user.name "wsb-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/roster.json data/latest.json data/history.json stats
          git diff --quiet --cached || git commit -m "Stats snapshot: $(date -u +'%Y-%m-%d')"
          git push
