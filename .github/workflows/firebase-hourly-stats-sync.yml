name: Firebase Hourly Stats Sync

on:
  schedule:
    # Recovery only: pushes and completed stats refreshes publish immediately.
    # Compare the live release to current main, not to an old fork checkout.
    - cron: "12,22,32,42,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy-current-stats:
    if: github.repository == 'adetrick7/WsB-eSports'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Firebase site
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check current Firebase release
        id: stats
        run: node .github/scripts/check-firebase-current.mjs

      - name: Authenticate with Firebase
        if: steps.stats.outputs.changed == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wsb-esports
          workload_identity_provider: projects/999242676867/locations/global/workloadIdentityPools/github-actions/providers/wsb-repo
          service_account: wsb-hosting-deploy@wsb-esports.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Verify before publishing
        if: steps.stats.outputs.changed == 'true'
        uses: ./.github/actions/verify

      - name: Deploy refreshed stats to Firebase
        if: steps.stats.outputs.changed == 'true'
        run: node .github/scripts/deploy-firebase-preview.mjs
        env:
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_HOSTING_CHANNEL: live
