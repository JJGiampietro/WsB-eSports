name: Firebase Hosting Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Fortnite Stats Refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'adetrick7/WsB-eSports' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check current Firebase release
        id: release
        run: node .github/scripts/check-firebase-current.mjs

      - name: Authenticate with Firebase
        if: steps.release.outputs.changed == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wsb-esports
          workload_identity_provider: projects/999242676867/locations/global/workloadIdentityPools/github-actions/providers/wsb-repo
          service_account: wsb-hosting-deploy@wsb-esports.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Verify before publishing
        if: steps.release.outputs.changed == 'true'
        uses: ./.github/actions/verify

      - name: Deploy Firebase production site
        if: steps.release.outputs.changed == 'true'
        run: node .github/scripts/deploy-firebase-preview.mjs
        env:
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_HOSTING_CHANNEL: live
