name: Firebase Hosting Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-preview:
    if: github.repository == 'adetrick7/WsB-eSports' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Authenticate with Firebase
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wsb-esports
          workload_identity_provider: projects/999242676867/locations/global/workloadIdentityPools/github-actions/providers/wsb-repo
          service_account: wsb-hosting-deploy@wsb-esports.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Verify before publishing
        uses: ./.github/actions/verify

      - name: Refresh Firebase preview
        run: node .github/scripts/deploy-firebase-preview.mjs
        env:
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
